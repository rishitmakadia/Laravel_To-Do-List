services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_to_do_list
    volumes:
      - ./:/var/www/html
    ports:
      - "8060:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: laravel_to_do_list_mysql
    restart: always
    environment:
      MYSQL_DATABASE: todo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - mysql_data5:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_to_do_list_phpmyadmin
    restart: always
    ports:
      - "8070:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data5:
